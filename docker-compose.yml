version: '3.9'
services:
  app:
    build: .
    ports:
     - "3000:3000"
    environment:
     - NODE_ENV=development
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: my-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
